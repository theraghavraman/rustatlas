name: Import Rust Atlas project archive
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-rust-atlas.yml"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download uploaded Rust Atlas archive
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3FzCwEAyBYPHUZGmyeTiRgA7KBh/79582bd0-0597-4ee2-b420-e08c47963ec6.zip" \
            --output /tmp/rust-atlas.zip
          test -s /tmp/rust-atlas.zip
          unzip -tq /tmp/rust-atlas.zip

      - name: Install complete project at repository root
        run: |
          mkdir -p /tmp/rust-atlas-unpacked
          unzip -q /tmp/rust-atlas.zip -d /tmp/rust-atlas-unpacked
          test -d /tmp/rust-atlas-unpacked/Rust_Atlas
          rsync -a --delete --exclude='.git/' \
            /tmp/rust-atlas-unpacked/Rust_Atlas/ ./
          test -s index.html
          test -s dist/index.html
          test -s dist/app.js
          test -s README.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          manifest = json.loads((root / "dist/book-manifest.json").read_text(encoding="utf-8"))
          pages = list((root / "dist/content").glob("*.json"))
          assert pages, "No book page JSON files were extracted"
          assert (root / "source/rust-book.original.md").is_file()
          assert len((root / "index.html").read_text(encoding="utf-8")) > 1_000_000
          print(f"Verified standalone HTML, dist app, {len(pages)} content files, and manifest ({len(manifest) if isinstance(manifest, (list, dict)) else 'parsed'}).")
          PY

      - name: Commit the complete site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Rust Atlas learning studio"
          git push origin HEAD:main
